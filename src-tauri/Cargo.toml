[package]
name = "lupus-software-center"
version = "2.0.1"
description = "LupuS Software Center - Luppo Market"
authors = ["Solzic0 <solzic0@yandex.com>", "Antolun <admin@antolun.com>"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lupus_software_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [
    "tray-icon",
    "image-ico",
    "image-png",
    "protocol-asset",
] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
xml-rs = "0.8"
dirs = "5"
glib = "0.18"
libc = "0.2"
