[package]
name = "lupus-software-center"
version = "2.0.6"
description = "LupuS Software Center - Luppo Market"
authors = ["Solzic0 <solzic0@yandex.com>", "Antolun <admin@antolun.com>"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
xml-rs = "0.8"
dirs = "5"
glib = "0.18"
libc = "0.2"
luppo-core = { path = "../luppo/luppo-core" }
